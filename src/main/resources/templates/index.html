<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <title>Activity Track Points</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .track-control {
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
        .track-control input {
            display: block;
            margin-bottom: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .track-control button {
            width: 100%;
            cursor: pointer;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 5px;
        }
        .track-control button:hover {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script th:inline="javascript">
        const map = L.map('map').setView([55.7887, 49.1221], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const trackControl = L.control({ position: 'topright' });
        trackControl.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'track-control leaflet-bar');

            div.innerHTML = `
                <label>Begin:</label>
                <input type="datetime-local" id="startTimeBegin">
                <label>End:</label>
                <input type="datetime-local" id="startTimeEnd">
                <button onclick="loadTrack()">Show track</button>
            `;

            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);

            return div;
        };
        trackControl.addTo(map);

        async function loadTrack() {
            const begin = document.getElementById('startTimeBegin').value;
            const end = document.getElementById('startTimeEnd').value;

            if (!begin || !end) {
                alert("Set the beginning and end of the interval");
                return;
            }

            const response = await fetch(`/track/points?startTimeBegin=${begin}&startTimeEnd=${end}`);
            const points = await response.json();

            if (points && points.length > 0) {
                if (window.currentPolyline) map.removeLayer(window.currentPolyline);

                window.currentPolyline = L.polyline(points, {
                    color: 'blue',
                    weight: 4,
                    opacity: 0.65,
                    smoothFactor: 1
                }).addTo(map);
                map.fitBounds(window.currentPolyline.getBounds());
            } else {
                alert("No data for this period");
            }
        }
    </script>
</body>
