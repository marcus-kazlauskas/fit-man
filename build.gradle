plugins {
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
	id 'org.jetbrains.kotlin.plugin.spring' version "${kotlinVersion}"
	id 'org.jetbrains.kotlin.plugin.jpa' version "${kotlinVersion}"
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'pmd'
	id 'org.openapi.generator' version "${openapiGeneratorVersion}"
	id 'jacoco'
}

group = 'fit.man'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of("$javaVersion")
	}
}

kotlin {
	jvmToolchain(Integer.parseInt("$javaVersion"))
}

repositories {
	mavenCentral()
}

dependencies {
	implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocStarterUi}"

	implementation "com.garmin:fit:${fitVersion}"

	implementation "net.sf.geographiclib:GeographicLib-Java:$geographicLibVersion"

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'

	testRuntimeOnly "com.h2database:h2"

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pmd {
	consoleOutput = true
	rulesMinimumPriority = 5
	ruleSets = []
	ruleSetFiles = files("$rootDir$rulesetFile")
}

openApiGenerate {
	generatorName = "kotlin-spring"
	inputSpec = "$rootDir$apiSpecDir/openapi-fit-man.yaml"
	outputDir = "$rootDir$apiGenDir"
	apiPackage = "fit.man.app.api"
	modelPackage = "fit.man.app.api.model"
	templateDir = "$rootDir$apiSpecDir/templates"
	validateSpec = true
	configOptions = [
			"interfaceOnly": "true",
			"useSpringBoot4": "true",
			"useJakartaEe": "true",
			"exceptionHandler": "false"
	]
}

sourceSets {
	main {
		kotlin {
			srcDirs += "$rootDir$apiGenDir/src/main/kotlin"
		}
	}
}

def jacocoExcludes = [
		'**/api/*Api.class',
		'**/api/*Util.class',
		'**/api/model/**'
]

jacocoTestReport {
	dependsOn test
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	}))
	finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	}))
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

test {
	systemProperty 'spring.profiles.active', 'test'
	useJUnitPlatform()
	testLogging {
		showStandardStreams = true
		events "passed", "skipped", "failed"
	}
	finalizedBy jacocoTestReport
}

check {
	dependsOn jacocoTestReport
}

tasks.register("copyOpenApiToResources", Copy) {
	from("$rootDir$apiSpecDir")
	into("$rootDir/build/resources/main/static")
	include("*.yaml")
}

tasks.named("compileJava") {
	dependsOn("openApiGenerate")
}

tasks.named("compileKotlin") {
	dependsOn("openApiGenerate")
}

tasks.named("processResources") {
	dependsOn("copyOpenApiToResources")
}

tasks.named("bootRun") {
	dependsOn("pmdMain")
}
